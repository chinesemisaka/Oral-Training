name: Upstream PR 4 full validation

on:
  push:
    branches:
      - ci/upstream-pr-4-full-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-pr-4-full-validation
  cancel-in-progress: true

jobs:
  windows-full:
    name: Windows MSVC, PostgreSQL and API
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PGPASSWORD: root
      DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/oral_training_ci
      ORAL_TRAINING_TEST_DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/oral_training_ci
      AUTH_MODE: demo
      PRODUCTION: "false"
      BIND_ADDRESS: 127.0.0.1
      PORT: "8080"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout tested snapshot
        uses: actions/checkout@v4

      - name: Start disposable PostgreSQL database
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          & "$env:PGBIN\dropdb.exe" --if-exists -U postgres oral_training_ci
          & "$env:PGBIN\createdb.exe" -U postgres oral_training_ci
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create oral_training_ci.' }

      - name: Apply all migrations
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath backend/migrations -Filter '0??_*.sql' |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "Applying $($_.Name)"
              & "$env:PGBIN\psql.exe" $env:DATABASE_URL -v ON_ERROR_STOP=1 -X -f $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Migration failed: $($_.Name)" }
            }

      - name: Configure MSVC v143 build
        shell: pwsh
        run: cmake -S backend -B backend/build-msvc -G 'Visual Studio 18 2026' -A x64 -T v143 -DPostgreSQL_ROOT="$env:PGROOT"

      - name: Build Release
        shell: pwsh
        run: cmake --build backend/build-msvc --config Release --parallel 2

      - name: Run CTest suite
        shell: pwsh
        run: ctest --test-dir backend/build-msvc -C Release --output-on-failure

      - name: Validate empty, historical and repeated migrations
        shell: pwsh
        run: |
          & ./backend/tests/migration_reliability.ps1 -DatabaseUrl $env:DATABASE_URL -PsqlPath "$env:PGBIN\psql.exe"

      - name: Run backend integration suite
        shell: pwsh
        run: |
          $process = Start-Process ./backend/build-msvc/Release/oral_training_backend.exe -RedirectStandardOutput backend-stdout.log -RedirectStandardError backend-stderr.log -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/health' -TimeoutSec 2
                if ($response.code -eq 0 -and $response.data.database) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw 'Backend did not become healthy.' }

            & pwsh -NoProfile -File ./backend/tests/smoke.ps1
            if ($LASTEXITCODE -ne 0) { throw 'API smoke without model failed.' }

            if ([string]::IsNullOrWhiteSpace($env:DEEPSEEK_API_KEY)) {
              Write-Warning 'DEEPSEEK_API_KEY is not configured; real-model and model concurrency checks were skipped.'
            } else {
              & pwsh -NoProfile -File ./backend/tests/smoke.ps1 -WithModel
              if ($LASTEXITCODE -ne 0) { throw 'Controlled real-model smoke failed.' }
              & pwsh -NoProfile -File ./backend/tests/concurrency.ps1 -DatabaseUrl $env:DATABASE_URL -PsqlPath "$env:PGBIN\psql.exe"
              if ($LASTEXITCODE -ne 0) { throw 'Concurrency test failed.' }
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: |
            backend-stdout.log
            backend-stderr.log
          if-no-files-found: ignore
